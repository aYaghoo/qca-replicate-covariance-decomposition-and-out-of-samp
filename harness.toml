# Harness policy (schema v1): which checks run, what blocks, and the harness's
# own rules. Tool rule selection stays in pyproject.toml and .semgrep/.
# Full schema: the agent-harness repo's docs/harness-toml.md.
schema_version = 1

[project]
python = ".venv/bin/python"   # runs mypy, pytest, and pip-audit
exclude = [".semgrep/**"]     # skipped by every check, on top of each tool's own excludes
import_roots = ["."]      # default: "src" if it exists, else "."

# --- When checks run ---------------------------------------------------------
[checks]
fast = [  # after each write
  "ruff", "file-length", "comment-length", "hygiene", "codespell",
  "suppressions", "protected-files", "dependencies",  # compare with the session's baseline
]
gate = ["mypy", "semgrep", "pydoclint", "interrogate", "vulture", "gitleaks", "pip-audit", "pytest"]

# --- Severity ----------------------------------------------------------------
# Everything blocks unless matched here: a source ("vulture") or a source:rule glob.
[severity]
warn = [
  "vulture",
  "semgrep:hf-from-pretrained-unpinned",
  "semgrep:hf-download-unpinned",
]

# --- Feedback to the agent ---------------------------------------------------
[feedback]
max_violations = 20
rationale = true  # first occurrence of each rule gets a one-line "why"

# --- Tools -------------------------------------------------------------------
# Every [tools.X] accepts timeout (seconds) and exclude (globs). Tools found by
# executable name also accept executable.
[tools.semgrep]
configs = [".semgrep/", "p/python", "p/secrets", "p/cwe-top-25", "p/trailofbits"]

[tools.pydoclint]
exclude = ["tests/**"]

[tools.interrogate]
paths = ["src"]

[tools.pip-audit]
requirements = ["requirements.txt"]

[tools.pytest]
args = []
timeout = 900

# --- The harness's own rules ---------------------------------------------------
[rules.file-length]
max_lines = 500  # a ratchet against the baseline: an oversized file may not grow

[rules.comment-length]
max_lines = 2
check_doc_links = true  # "# See docs/x.md" must point to a real file

[rules.hygiene]
max_file_kb = 500
forbid_conflict_markers = true
forbid_private_keys = true

# --- Enforced from Stage 3 and 4; parsed and kept until then ------------------------
[loop]
max_rounds_per_violation = 3  # same violation survives 3 rounds -> escalate to human

[rules.no-new-suppressions]
patterns = [
  "# noqa",
  "# type: ignore",
  "# nosemgrep",
  "# nosec",
  "# pragma: no cover",
  "# pylint: disable",
  "# pyright: ignore",
]

[rules.protected-files]
paths = [
  "**/pyproject.toml:[tool.*]",
  "**/ruff.toml", "**/.ruff.toml",  # Ruff also reads config from subdirectories
  "mypy.ini", ".mypy.ini", "setup.cfg", ".codespellrc",
  ".semgrep/**", ".semgrepignore", ".gitleaks.toml", ".gitleaksignore",
  ".pre-commit-config.yaml",
  "harness.toml",
  "requirements*.txt",
  ".claude/**",   # Claude Code settings, including hooks
  ".gitignore",   # ignored files are invisible to every check
]

[rules.dependencies]
watch = ["requirements.in", "requirements-dev.in"]
lockfiles = ["requirements.txt", "requirements-dev.txt"]
