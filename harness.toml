# Harness policy: rules the off-the-shelf tools don't cover, plus when each
# check runs and how its results are fed back to the agent.
# Tool-level rule selection lives in pyproject.toml and .semgrep/.

[loop]
max_rounds_per_violation = 3   # same violation survives 3 rounds -> escalate to human
max_violations_in_feedback = 20
include_rule_rationale = true  # first occurrence of each rule gets its "why"

# --- When checks run ---------------------------------------------------------
[checks.fast]   # after every file write, on that file only
steps = [
  "ruff format",
  "ruff check --fix",
  "ruff check --output-format json",
  "custom",  # file-length, comment-length, suppressions, protected files, hygiene
]

[checks.gate]   # when the agent says it is done (stop_reason == "end_turn")
steps = [
  "mypy --output json",
  "semgrep --json",
  "pydoclint",
  "interrogate",
  "vulture",
  "pip-audit --format json",
  "modelscan",
  "pytest",
]

[semgrep]
configs = [".semgrep/", "p/python", "p/secrets", "p/cwe-top-25", "p/trailofbits"]

# --- Custom rules ------------------------------------------------------------
[rules.file-length]
applies_to = ["*.py"]
max_lines = 500
blocking = true
message = """{path} has {n} lines; .py files must be <= {max_lines}. \
Split it by responsibility into modules of at most {max_lines} lines each."""

# Comments explain intent in at most 2 lines; anything longer goes in docs/.
# Implemented in the agent-harness repo (harness_checks/comment_length.py).
[rules.comment-length]
applies_to = ["*.py"]
max_lines = 2
blank_lines_split_blocks = false  # spacing comments out does not reset the count
check_doc_links = true            # "# See docs/x.md" must point to a real file
docs_dir = "docs"
blocking = true
message = """{path}:{start}-{end} is a {n}-line comment; comments must be \
<= {max_lines} lines. Shorten it, or move the explanation to a file under \
docs/ and leave a one-line pointer such as '# See docs/<topic>.md'."""

# The agent may not silence a check. Suppressions that already exist in the
# repo are allowed; new ones in the agent's diff are blocking. A legitimate
# exception goes through you, not the agent.
[rules.no-new-suppressions]
patterns = [
  "# noqa",
  "# type: ignore",
  "# nosemgrep",
  "# nosec",
  "# pragma: no cover",
  "# pylint: disable",
  "# pyright: ignore",
]
blocking = true
message = """{path}:{line} adds a suppression comment ({pattern}). \
Fix the underlying issue instead. If you believe the rule is wrong here, \
stop and explain why in your final message."""

# The agent may not weaken the policy itself.
[rules.protected-files]
paths = [
  "pyproject.toml:[tool.ruff*]",
  "pyproject.toml:[tool.mypy*]",
  ".semgrep/**",
  ".pre-commit-config.yaml",
  "harness.toml",
  "requirements*.txt",  # regenerated by pip-compile, never hand-edited
]
blocking = true
message = "{path} is harness policy and cannot be edited by the agent."

[rules.dependencies]
# New dependencies need human approval and must be locked with hashes.
# requirements*.in are the source of truth; *.txt are compiled by pip-compile.
new_dependency_blocking = true
watch = ["requirements.in", "requirements-dev.in"]
lockfiles = ["requirements.txt", "requirements-dev.txt"]
require_hashes = true
message = """New dependency {name} added. Dependencies require human approval; \
use the standard library or an existing dependency, or stop and request it."""

[rules.hygiene]
# Re-checked inside the loop so the agent gets feedback before commit time.
max_file_kb = 500
forbid_conflict_markers = true
forbid_private_keys = true

# --- Severity ----------------------------------------------------------------
# Everything blocks unless listed here. Warnings are reported but don't stop
# the agent from finishing.
[severity]
warn_only = [
  "vulture",
  "semgrep:hf-from-pretrained-unpinned",
  "semgrep:hf-download-unpinned",
]
